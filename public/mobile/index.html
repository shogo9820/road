<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅飲み人生ゲーム - コントローラー</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="controller.css">
  <script src="/socket.io/socket.io.js"></script>
  <script src="controller.js"></script>
</head>
<body class="phone-body">

  <!-- 【A】ルーム接続画面 -->
  <div id="phone-screen-join" class="active">
    <div class="phone-screen">
      <div class="player-banner-zone">📱 コントローラー</div>
      <div class="current-tile-or-event-status-box">
        <label style="width:100%; font-weight:bold;">
          PC画面に表示されているルームコードを入力してください<br><br>
          ルームコード（4桁）<br>
          <input type="text" id="input-room-code" placeholder="例: 2187" style="width:85%; padding:12px; margin-top:8px; font-size:1.2rem; border-radius:8px; border:1px solid #ccc; text-align:center;">
        </label>
      </div>
      <button id="btn-join-room" class="btn-blue">🔑 ルームに接続する</button>
    </div>
  </div>

  <!-- 【B】参加者設定・待機室画面 -->
  <div id="phone-screen-setup" style="display: none;">
    <div class="phone-screen">
      <div class="player-banner-zone">⚙ 設定</div>
      <div class="current-tile-or-event-status-box" style="flex-direction:column; gap:10px; align-items:stretch;">
        <span style="font-weight:bold; font-size:1.1rem; text-align:center; display:block;">参加プレイヤー設定</span>
        <div id="phone-player-list"></div>
        <button id="btn-phone-add-player" class="btn-blue" style="font-size:1rem; padding:8px; width:100%; max-width:100%;">➕ プレイヤーを追加</button>
      </div>
      <div class="current-tile-or-event-status-box" style="justify-content: space-around;">
        <span style="font-weight:bold;">ゲームモード:</span>
        <label><input type="radio" name="phone-mode" value="normal" checked> 通常</label>
        <label><input type="radio" name="phone-mode" value="short"> ショート</label>
      </div>
      <button id="btn-phone-start" class="btn-orange">🎮 ゲームスタート！</button>
    </div>
  </div>

  <!-- 【C】🎯 設計図通り：ゲーム本番プレイ制御画面（余白ゼロ） -->
  <div id="phone-screen-play" style="display: none;">
    <div class="phone-screen">
      
      <!-- 1. 操作中のプレイヤー名 -->
      <div class="player-banner-zone" id="current-player-banner">TURN: ----</div>
      
      <!-- 2. ルーレット盤 ＆ 3. 出目表示の一体化コンテナ -->
      <div class="roulette-section-container">
        <!-- 3. 出目表示（円の上側に美しく固定） -->
        <div class="result-display-zone" id="roulette-result-display">🎯 タップして回そう！</div>
        
        <!-- 2. ルーレットサークル本体 -->
        <div class="controller-roulette-container">
          <div class="event-roulette-pointer"></div>
          <div class="roulette-wheel-board" id="controller-roulette-wheel">
            <div class="roulette-num num-1">1</div>
            <div class="roulette-num num-2">2</div>
            <div class="roulette-num num-3">3</div>
            <div class="roulette-num num-4">4</div>
            <div class="roulette-num num-5">5</div>
            <div class="roulette-num num-6">6</div>
            <div class="roulette-num num-7">7</div>
            <div class="roulette-num num-8">8</div>
            <div class="roulette-num num-9">9</div>
            <div class="roulette-num num-10">10</div>
          </div>
        </div>
      </div>

      <!-- 4. 現在のいるマスやイベント時のテキスト -->
      <div class="current-tile-or-event-status-box" id="phone-current-tile-desc">
        スタート前
      </div>

      <!-- 5. ルーレットを回すボタン -->
      <button id="btn-phone-spin" class="btn-orange">⚡ ルーレットを回す！</button>
      
      <!-- 6. 次のプレイヤーへボタン -->
      <button id="btn-phone-next" class="btn-blue hidden" style="display:none;">➡ 次のプレイヤーへ</button>

      <!-- 🛠 開発用デバッグメニュー（最下部に密着配置） -->
      <div class="developer-debug-zone-panel" style="margin-top:5px;">
        <button id="btn-warp-34" class="btn-dark-debug" style="font-size:0.9rem; padding:8px;">35マス目（カップル）にワープ</button>
      </div>
    </div>
  </div>

  <!-- 🎯【バグ完全根絶】カップルイベント専用の隔離モーダル（通常時は100%完全非表示） -->
  <div id="mobile-couple-event-modal" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999;">
    <div class="phone-screen theme-couple" style="background: #ffffff; padding: 20px; border-radius: 16px; width: 85%; text-align: center; box-shadow: 0 4px 20px rgba(0,0,0,0.3); gap:16px;">
      <div class="player-banner-zone" style="background:#fff0f5; color:#d81b60; border-color:#ff69b4;">💕 カップルイベント 💕</div>
      <div class="current-tile-or-event-status-box couple-desc" style="border-color:#ff69b4; font-weight:bold; font-size:1rem; line-height:1.4;">
        運命のルーレットを回そう！
      </div>
      <!-- カップル時のスマホスピン用ピンクボタン -->
      <button id="btn-couple-spin" class="btn-pink" onclick="requestSpin();">💖 ルーレットを回す！</button>
    </div>
  </div>

  <!-- 役職選択用ダイアログモーダル -->
  <div id="job-modal-overlay" style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; z-index: 9999;">
    <div class="phone-screen" style="background: #ffffff; padding: 20px; border-radius: 16px; width: 85%; text-align: center; gap:16px;">
      <div class="player-banner-zone">✨ 役職マス発見！</div>
      <div class="current-tile-or-event-status-box" id="job-modal-desc" style="font-size:1rem; line-height:1.4;">就職しますか？</div>
      <div style="display:flex; gap:10px; width:100%; max-width:340px;">
        <button id="btn-job-yes" class="btn-blue" style="flex:1;">はい</button>
        <button id="btn-job-no" class="btn-orange" style="flex:1;">いいえ</button>
      </div>
    </div>
  </div>

</body>
</html>
