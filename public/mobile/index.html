<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>宅飲み人生ゲーム - コントローラー</title>
  <link rel="stylesheet" href="../css/common.css">
  <link rel="stylesheet" href="controller.css">
  <!-- ルートのマニフェストを読み込み -->
  <link rel="manifest" href="../manifest.json">
  <script src="/socket.io/socket.io.js"></script>
  <!-- 管理用JS -->
  <script src="controller.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('../sw.js')
          .then((reg) => console.log('[PWA] サービスワーカー登録成功（スマホ）:', reg.scope))
          .catch((err) => console.error('[PWA] サービスワーカー登録失敗:', err));
      });
    }
  </script>
</head>
<body class="phone-screen-body">

  <div class="phone-screen">

    <!-- 【1】ルーム接続画面 -->
    <div id="phone-screen-join" class="card phone-card">
      <h1 style="text-align: center; font-size: 1.6rem; margin-top:0;">📱 コントローラー</h1>
      <p style="font-size: 0.9rem; color: #666; text-align: center; margin-bottom: 20px;">
        PC画面に表示されているルームコードを入力してください
      </p>
      
      <form id="form-join-room" style="display: flex; flex-direction: column; gap: 12px; width: 100%; align-items: center;">
        <div style="width: 100%; max-width: 340px;">
          <label style="display: block; font-weight: bold; margin-bottom: 6px; font-size: 0.95rem;">ルームコード（4桁）</label>
          <input type="number" id="input-room-code" placeholder="例: 1234" pattern="\d*" style="width: 100%; padding: 14px; font-size: 1.3rem; border-radius: 12px; border: 2px solid #ccc; text-align: center; box-sizing: border-box;">
        </div>
        <button id="btn-join-room" class="btn-orange">🔑 ルームに接続する</button>
      </form>
    </div>

    <!-- 【2】ゲーム設定・参加待機画面 -->
    <div id="phone-screen-setup" class="card phone-card" style="display: none;">
      <h2 style="margin-top: 0; border-bottom: 2px solid #e0e0e0; padding-bottom: 6px;">⚙ 設定</h2>
      
      <div style="margin-bottom: 16px; width: 100%;">
        <label style="display: block; font-weight: bold; margin-bottom: 8px;">参加プレイヤー設定</label>
        <div id="phone-player-list"></div>
        <button type="button" id="btn-phone-add-player" class="btn-blue" style="font-size: 1rem; padding: 10px; margin-top: 8px; max-width: 100%;">
          ➕ プレイヤーを追加
        </button>
      </div>

      <div style="margin-bottom: 24px; width: 100%;">
        <label style="display: block; font-weight: bold; margin-bottom: 6px;">ゲームモード:</label>
        <div style="display: flex; gap: 16px; background: #f5f5f5; padding: 10px; border-radius: 10px; justify-content: space-around;">
          <label style="font-weight: bold; cursor: pointer;">
            <input type="radio" name="phone-mode" value="normal" checked> 通常
          </label>
          <label style="font-weight: bold; cursor: pointer;">
            <input type="radio" name="phone-mode" value="short"> ショート
          </label>
        </div>
      </div>

      <button id="btn-phone-start" class="btn-orange">🎮 ゲームスタート！</button>
    </div>

    <!-- 【3】メインゲーム操作画面（プレイ中） -->
    <div id="phone-screen-play" class="card phone-card" style="display: none; width: 100%;">
      
      <!-- 1. 現在操作中のプレイヤー名バナー -->
      <div class="player-banner-zone" id="current-player-banner">TURN: ----</div>

      <!-- 2 & 3. 共通仕様を100%再利用したスマホ用ルーレットコンテナ -->
      <div class="roulette-section-container" style="width: 100%; max-width: 340px; margin: 0 auto;">
        <div class="result-display-zone" id="roulette-result-display">🎯 タップして回そう！</div>
        
        <div class="controller-roulette-container">
          <div class="event-roulette-pointer"></div>
          <div class="roulette-wheel-board" id="controller-roulette-wheel">
            <div class="roulette-num num-1">1</div>
            <div class="roulette-num num-2">2</div>
            <div class="roulette-num num-3">3</div>
            <div class="roulette-num num-4">4</div>
            <div class="roulette-num num-5">5</div>
            <div class="roulette-num num-6">6</div>
            <div class="roulette-num num-7">7</div>
            <div class="roulette-num num-8">8</div>
            <div class="roulette-num num-9">9</div>
            <div class="roulette-num num-10">10</div>
          </div>
        </div>
      </div>

      <!-- 4. プレイヤーの簡易ステータス表示板 -->
      <div class="current-tile-or-event-status-box" style="flex-direction: column; gap: 4px; padding: 10px; font-size: 0.95rem;">
        <div style="display: flex; justify-content: space-between; width: 100%;">
          <span>👤 <span id="phone-current-name">----</span> (<span id="phone-current-job">モブ</span>)</span>
          <span style="font-weight: 900; color: #e74c3c;">❤ HP: <span id="phone-current-hp">-- / --</span></span>
        </div>
      </div>

      <!-- 5 & 6. メインアクション操作ボタン -->
      <div style="width: 100%; display: flex; flex-direction: column; gap: 10px; align-items: center; margin-top: 4px;">
        <button id="btn-phone-spin" class="btn-orange">⚡ ルーレットを回す！</button>
        <button id="btn-phone-next" class="btn-blue hidden" style="display: none;">➡ 次のプレイヤーへ</button>
      </div>

      <!-- 🛠️ 開発デバッグ専用隠しメニューパネル -->
      <div class="developer-debug-zone-panel" style="margin-top: 20px; padding-top: 12px; border-top: 2px dashed #ccc; width: 100%; display: flex; flex-direction: column; align-items: center; gap: 8px;">
        <div style="display: flex; gap: 8px; width: 100%; max-width: 280px;">
          <input type="number" id="input-debug-square" placeholder="マス番号 (0〜99)" min="0" max="99" style="flex: 1; padding: 8px; font-size: 1rem; border-radius: 8px; border: 1px solid #ccc; text-align: center;">
          <button type="button" id="btn-debug-warp" class="btn-dark-debug" style="width: auto; padding: 8px 16px; margin: 0; font-size: 0.95rem;">ワープ</button>
        </div>
      </div>

    </div>

  </div>

  <!-- 🎯 役職選択用ダイアログ（モーダルオーバーレイ） -->
  <div id="job-modal-overlay" class="event-modal-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:99999;">
    <div class="card" style="background:#fff; width:85%; max-width:340px; padding:20px; border-radius:16px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.2);">
      <h3 style="margin-top:0; color:#9c27b0; font-size:1.3rem;">✨ 役職マス発見！</h3>
      <p id="job-modal-desc" style="font-weight:bold; font-size:0.95rem; white-space:pre-wrap; line-height:1.5; margin-bottom:20px;">就職しますか？</p>
      <div style="display:flex; gap:12px;">
        <button id="btn-job-yes" class="btn-orange" style="padding:10px; font-size:1.1rem;">はい</button>
        <button id="btn-job-no" class="btn-blue" style="padding:10px; font-size:1.1rem; background-color:#78909c;">いいえ</button>
      </div>
    </div>
  </div>

  <!-- 🎯 スマホ側カップルイベント専用サブモーダル -->
  <div id="mobile-couple-event-modal" class="event-modal-overlay" style="display: none; position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); justify-content:center; align-items:center; z-index:99998; box-sizing:border-box; padding:12px;">
    <div class="card theme-couple" style="background:#fff0f5; border:3px solid #ff69b4; width:100%; max-width:360px; padding:16px; border-radius:16px; text-align:center; box-shadow:0 4px 20px rgba(0,0,0,0.2);">
      <h3 style="margin-top:0; color:#d81b60; font-size:1.3rem;">💕 カップルイベント 💕</h3>
      <p class="couple-desc" style="font-weight:bold; font-size:0.9rem; line-height:1.4; margin-bottom:12px; color:#333;">
        運命のルーレットを回そう！
      </p>
      <button id="btn-couple-spin" class="btn-pink" onclick="requestSpin()" style="margin:0 auto; max-width:280px; background-color:#ff4081; color:#fff;">💖 ルーレットを回す！</button>
    </div>
  </div>

</body>
</html>
